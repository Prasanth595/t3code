<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>T3 Code is not reachable</title>
    <!-- Fork: the service worker (`sw.js`) shows this page when this server does not answer. -->
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #262626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0a0a0a;
          color: #f5f5f5;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.75;
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>T3 Code is not reachable</h1>
      <p>This device is offline, or the machine that runs this T3 Code server is off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
