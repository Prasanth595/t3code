name: Mobile Android APK

# Publishes the newest Alpha and internal-testing Android builds as a sideloadable APK
# on separate rolling prereleases for users who can't join
# the Play testing group. Play re-signs uploaded bundles with the app signing
# key, so its universal APK matches the Play Store install and needs no signing
# secrets here. EAS submits asynchronously (--no-wait), so this polls Play
# instead of chaining off mobile-eas-production.yml; runs with nothing new exit
# early.
on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: mobile-android-apk
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror Play APK (${{ matrix.track }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: alpha
            tag: android-nightly
            title: T3 Code for Android (Alpha)
            stability: Alpha closed testing. These builds have been promoted for wider testing, but may still contain bugs.
          - track: internal
            tag: android-internal
            title: T3 Code for Android (internal)
            stability: Internal testing. These are the newest, less-tested builds and may contain serious bugs. Prefer the Alpha release for everyday use.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_NAME: com.t3tools.t3code
      PLAY_TRACK: ${{ matrix.track }}
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_TITLE: ${{ matrix.title }}
      RELEASE_STABILITY: ${{ matrix.stability }}
    steps:
      - id: credentials
        name: Check for Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not available; skipping APK mirror."
          fi

      - name: Checkout
        if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Mirror the newest APK
        if: steps.credentials.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/mirror-play-apk.cjs
