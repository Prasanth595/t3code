name: Factory desktop

# Builds the fork's macOS desktop app (arm64) on every push to main, signs and
# notarizes it with the Developer ID in the desktop-release environment, and
# publishes it as a prerelease on this repo. Installed apps follow those
# prereleases through their nightly update feed. Upstream's release workflows
# stay disabled; the mac build steps here are copied from release-desktop.yml.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit on main is worth publishing.
concurrency:
  group: factory-desktop
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and publish (mac arm64)
    runs-on: macos-15
    timeout-minutes: 60
    # The secrets live in this environment, which only main may deploy from.
    environment: desktop-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check signing secrets
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: factory/scripts/desktop-preflight.sh

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install
        run: vp i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - id: version
        name: Resolve version
        run: |
          version="$(factory/scripts/desktop-version.sh "$GITHUB_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Align package versions to the build version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build signed desktop artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: original-solutions/t3code-factory
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # electron-builder notarizes with APPLE_API_KEY as a path to the .p8.
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"

          profile_path="$RUNNER_TEMP/t3code-factory.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

          node scripts/build-desktop-artifact.ts \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$VERSION" \
            --signed \
            --verbose

      - id: assets
        name: Find build artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          if [[ ${#dmgs[@]} -ne 1 || ${#zips[@]} -ne 1 || ! -f release/nightly-mac.yml ||
                ! -f "${zips[0]}.blockmap" ]]; then
            echo "::error::Expected one dmg, one zip with its blockmap and nightly-mac.yml in release/."
            ls -la release
            exit 1
          fi
          echo "dmg=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple the dmg
        env:
          DMG: ${{ steps.assets.outputs.dmg }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: factory/scripts/desktop-notarize-dmg.sh "$DMG" release/nightly-mac.yml

      - name: Verify signature, Gatekeeper and notarization
        env:
          DMG: ${{ steps.assets.outputs.dmg }}
          ZIP: ${{ steps.assets.outputs.zip }}
        run: factory/scripts/desktop-verify.sh "$DMG" "$ZIP"

      # Created as a draft and published only once every asset is uploaded, so a
      # failed upload never leaves a release an updater could follow.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.assets.outputs.dmg }}
          ZIP: ${{ steps.assets.outputs.zip }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release create "$tag" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "T3 Code Factory $VERSION" \
            --notes "Nightly macOS (Apple Silicon) build of $GITHUB_SHA." \
            "$DMG" "$DMG.blockmap" "$ZIP" "$ZIP.blockmap" release/nightly-mac.yml
          gh release edit "$tag" --draft=false
