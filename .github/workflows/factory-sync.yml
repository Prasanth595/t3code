name: Factory sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-sync

# This is the fork's own workflow. It merges upstream's newest nightly tag into
# main through a pull request; factory/scripts/sync.sh says how. Upstream's code
# (install scripts, the route generator, the checks) runs only in `prepare`,
# which has no write token. `publish` holds the token and runs git and gh only.
jobs:
  prepare:
    name: Merge and check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # A full clone, not a sparse one: sparse-checkout makes Checkout a
      # blob:none partial clone whose promisor is this fork. Upstream then omits
      # from the tag fetch any blob a commit the fork already has introduced,
      # and the merge's lazy fetch of it from the fork fails.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # persist-credentials: false would remove the token inside Checkout, but
      # that cleanup runs `git submodule foreach`, which fails on the gitlinks
      # upstream left under .repos/ with no .gitmodules entry. Checkout keeps
      # the token in a file under RUNNER_TEMP that the local config includes.
      - name: Remove checkout's token
        run: |
          { git config --local --name-only --get-regexp '^includeif\.gitdir:' || true; } |
            xargs -r -n 1 git config --local --unset-all
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          if git config --get-regexp 'extraheader'; then exit 1; fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No cache: this job runs upstream's install scripts, and a cache it
          # saves would be restored by the fork's other workflows.
          cache: false

      - name: Merge and check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          factory/scripts/sync.sh prepare "$RUNNER_TEMP/sync"

      - name: Upload the prepared sync
        uses: actions/upload-artifact@v7
        with:
          name: sync
          path: ${{ runner.temp }}/sync
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Push, land or file
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Dispatches Factory CI, desktop and mobile on a landed sync, which
      # GITHUB_TOKEN's own push does not start.
      actions: write
    env:
      # Only whether the App is set up; its key stays in the Mint step.
      SYNC_APP_CONFIGURED: ${{ secrets.SYNC_APP_ID != '' && secrets.SYNC_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # As in prepare. git then fetches, and pushes when no sync secret is set,
      # through gh's credential helper with GH_TOKEN.
      - name: Remove checkout's token
        run: |
          { git config --local --name-only --get-regexp '^includeif\.gitdir:' || true; } |
            xargs -r -n 1 git config --local --unset-all
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          if git config --get-regexp 'extraheader'; then exit 1; fi

      - name: Download the prepared sync
        uses: actions/download-artifact@v8
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      # GITHUB_TOKEN cannot push a tag that changes .github/workflows/, so
      # sync.sh pushes with a GitHub App's token (SYNC_APP_ID,
      # SYNC_APP_PRIVATE_KEY), else a fine-grained token (SYNC_TOKEN), else
      # GITHUB_TOKEN. Either secret needs Contents and Workflows write on this
      # repository. A failed mint leaves sync.sh no App token, so its push fails
      # and files `cannot be pushed` rather than failing the job here.
      - name: Mint the push token
        id: app-token
        if: env.SYNC_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh auth setup-git
          factory/scripts/sync.sh publish "$RUNNER_TEMP/sync"
