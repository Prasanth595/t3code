name: Factory sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: factory-sync

# This is the fork's own workflow. It merges upstream's newest nightly tag into
# main through a pull request; factory/scripts/sync.sh says how.
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # sync.sh runs upstream's install scripts and tests, so the token is
          # not written into .git/config; git push uses gh's credential helper.
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          factory/scripts/sync.sh
