name: Factory docs

# Builds the docs site in factory/site on pull requests, and deploys it to GitHub Pages from main.
on:
  pull_request:
    paths:
      - factory/site/**
      - .github/workflows/factory-docs.yml
  push:
    branches:
      - main
    paths:
      - factory/site/**
      - .github/workflows/factory-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: factory/site
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: factory/site

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: factory/site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: factory/site/.vitepress/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
