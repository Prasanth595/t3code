name: Fork Release

# Rebases this fork onto upstream main, then publishes a nightly-channel
# release on the fork that the in-app updater (electron-updater) follows.
# A push to main releases it. The daily cron picks up upstream changes.
# See docs/fork.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      notify_agent:
        description: Call the agent webhook if this run fails. The agent sets false on its own retries.
        type: boolean
        default: true

# One run at a time. A newer push replaces a waiting run, and a running
# run finishes, so its force-push never races another sync.
concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code
  ISSUE_TITLE: "Fork release: upstream sync failed"

jobs:
  sync:
    name: Rebase onto upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      released: ${{ steps.released.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      # A scheduled run rebases main. A manual run rebases the branch it runs
      # from, so a branch can test this workflow without a change to main.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that change .github/workflows, and
          # upstream changes them often. FORK_SYNC_TOKEN is a token with the
          # workflow scope. Without it, a rebase over workflow changes fails at push.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          # No sparse checkout here: it makes a partial clone, and the rebase
          # then fails to fetch upstream blobs under .repos/ from origin.

      - id: rebase
        name: Rebase onto upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! git rebase upstream/main > "$RUNNER_TEMP/rebase.log" 2>&1; then
            cat "$RUNNER_TEMP/rebase.log"
            git status --short | head -50 >> "$RUNNER_TEMP/rebase.log"
            git rebase --abort
            echo "reason=rebase conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Fork commits on top of upstream:"
          git log --oneline upstream/main..HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: checks
        name: Typecheck
        run: |
          set -euo pipefail
          vp run typecheck
          # The fork only carries small patches, so a typecheck is the release
          # gate. The CI workflow runs the full tests on pushes to main.

      # A merge to main during this run makes the lease fail. Then rebase the
      # new main, typecheck it and push again, instead of failing the run.
      - id: push
        name: Push rebased branch
        run: |
          set -euo pipefail
          before="${{ steps.rebase.outputs.before }}"
          for attempt in 1 2 3; do
            if git push --force-with-lease="${GITHUB_REF_NAME}:${before}" origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${GITHUB_REF_NAME} moved during the run (attempt ${attempt}). Rebasing the new ${GITHUB_REF_NAME}."
            git fetch origin "${GITHUB_REF_NAME}"
            before="$(git rev-parse FETCH_HEAD)"
            git reset --hard "$before"
            if ! git rebase upstream/main > "$RUNNER_TEMP/rebase.log" 2>&1; then
              cat "$RUNNER_TEMP/rebase.log"
              git rebase --abort
              exit 1
            fi
            vp run typecheck
          done
          echo "${GITHUB_REF_NAME} kept moving; giving up after 3 attempts." >&2
          exit 1

      # The sync push itself starts a push run for the same commit. That run,
      # and a cron run with no new commits, find the release and stop here.
      - id: released
        name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.push.outputs.sha }}"
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName,name \
            --jq "[.[] | select(.name | contains(\"(${sha:0:12})\"))][0].tagName // empty")"
          if [[ -n "$existing" ]]; then
            echo "Commit ${sha} is already released as ${existing}."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Same version scheme as upstream nightlies: <base>-nightly.<UTC date>.<run number>.
      # The date and the run number only grow, so each fork release is newer than the last.
      - id: version
        name: Resolve release version
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ steps.push.outputs.sha }}" \
            --github-output

      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.rebase.outputs.reason || (steps.checks.outcome == 'failure' && 'typecheck or tests failed') || 'workflow step failed' }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Sync of \`${GITHUB_REF_NAME}\` onto ${UPSTREAM_REPOSITORY} main stopped: **${REASON}**."
            echo
            echo "Run: ${run_url}"
            if [[ -f "$RUNNER_TEMP/rebase.log" ]]; then
              echo
              echo '```'
              tail -60 "$RUNNER_TEMP/rebase.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${ISSUE_TITLE}\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

  build_bundle:
    name: Build JS bundle
    needs: [sync]
    if: needs.sync.outputs.released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Optional T3 Connect config. Empty values build the app without T3 Connect.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [sync, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    # Each platform publishes its own files, so the Mac release does not wait
    # for the slower Windows build, and a Windows failure does not stop it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      # The resource monitor build needs the Spectre-mitigated MSVC libraries.
      # The Visual Studio Installer takes minutes, so cache the library folder.
      - id: spectre
        name: Find Spectre-mitigated MSVC lib folder
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $msvc = Get-ChildItem "$installPath\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1
          "path=$($msvc.FullName)\lib\spectre" >> $env:GITHUB_OUTPUT
          "key=msvc-spectre-${env:ImageOS}-${env:ImageVersion}-$($msvc.Name)" >> $env:GITHUB_OUTPUT

      - id: spectre_cache
        if: matrix.platform == 'win'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.spectre.outputs.path }}
          key: ${{ steps.spectre.outputs.key }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win' && steps.spectre_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            Write-Error "Visual Studio Installer failed"
            exit 1
          }

      - if: matrix.platform == 'win' && steps.spectre_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.spectre.outputs.path }}
          key: ${{ steps.spectre.outputs.key }}

      # electron-builder only signs with a trusted identity. The self-made
      # certificate is its own root, so trust it on the runner for code signing.
      - name: Trust fork signing certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "CSC_LINK and CSC_KEY_PASSWORD are required. Squirrel.Mac rejects updates with another signature." >&2
            exit 1
          fi
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/fork.p12"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/fork.p12" -nokeys -clcerts -passin env:CSC_KEY_PASSWORD -out "$RUNNER_TEMP/fork.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fork.pem"
          rm -f "$RUNNER_TEMP/fork.p12"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_MAC_SELF_SIGNED: "true"
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
            --build-version "${{ needs.sync.outputs.version }}" --skip-build --verbose)
          # Windows stays unsigned. No Apple API key is set, so macOS is not notarized.
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          # The build script keeps only the dmg and zip, so check the app inside the zip.
          ditto -x -k release/*-arm64.zip "$RUNNER_TEMP/verify"
          app="$(ls -d "$RUNNER_TEMP"/verify/*.app)"
          codesign -dvv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          grep -q "Yarden Zamir T3 Fork" "$RUNNER_TEMP/codesign.txt"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      # The first platform to finish creates the release, the other adds its files.
      # Each platform has its own updater manifest: nightly-mac.yml and nightly.yml.
      # The release creates a tag. GITHUB_TOKEN cannot create a tag on a commit
      # whose workflow files differ from main, which happens when main moved
      # during the run. FORK_SYNC_TOKEN has the workflow scope.
      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          MANIFEST: ${{ matrix.platform == 'mac' && 'nightly-mac.yml' || 'nightly.yml' }}
        run: |
          set -euo pipefail
          test -s "release-publish/$MANIFEST"
          tag="${{ needs.sync.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&
            gh release create "$tag" release-publish/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ needs.sync.outputs.sha }}" \
              --title "${{ needs.sync.outputs.name }}" \
              --notes "Fork build of ${UPSTREAM_REPOSITORY} main plus fork commits, from ${{ needs.sync.outputs.sha }}." \
              --prerelease; then
            exit 0
          fi
          gh release upload "$tag" release-publish/* --repo "$GITHUB_REPOSITORY" --clobber

  # Starts a repair agent on a T3 server through a scheduled-task webhook.
  # Off until the T3_AGENT_WEBHOOK_URL secret is set. The URL is behind
  # Cloudflare Access, so the call sends the CF_ACCESS_CLIENT_* service token.
  notify_agent:
    name: Notify repair agent
    needs: [sync, build_bundle, desktop]
    if: failure() && github.event.inputs.notify_agent != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Call agent webhook
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.T3_AGENT_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SYNC_RESULT: ${{ needs.sync.result }}
          BUNDLE_RESULT: ${{ needs.build_bundle.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "T3_AGENT_WEBHOOK_URL is not set. No agent is notified."
            exit 0
          fi
          # A repair agent's push to main starts a run that cannot pass notify_agent=false.
          # So a failure right after a failure does not start another agent: the agent
          # that the first failure started watches this run and reports it.
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fork-release.yml --status completed --limit 5 \
            --json databaseId,conclusion --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].conclusion // empty")"
          if [[ "$previous" == "failure" ]]; then
            echo "The previous run failed too. No new agent is notified."
            exit 0
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sync "$SYNC_RESULT" \
            --arg build_bundle "$BUNDLE_RESULT" \
            --arg desktop "$DESKTOP_RESULT" \
            '{repository: $repository, branch: $branch, event: $event, run_url: $run_url, run_id: $run_id,
              jobs: {sync: $sync, build_bundle: $build_bundle, desktop: $desktop}}' \
            > "$RUNNER_TEMP/payload.json"
          cat "$RUNNER_TEMP/payload.json"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$WEBHOOK_URL" \
            -H "content-type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data-binary "@$RUNNER_TEMP/payload.json"
