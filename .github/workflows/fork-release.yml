name: Fork Release

# Builds the desktop apps from fork main and publishes a nightly-channel release
# that the in-app updater (electron-updater) follows. Linux also gets the
# self-contained server archive (t3-<version>-linux-<arch>.tar.gz) for machines
# without a display. It does not touch main:
# .github/workflows/fork-sync.yml merges upstream. Server and web changes reach
# the machines through the live server path, so a release is only needed when
# the app shell changes. See docs/fork.md.

on:
  push:
    branches: [main]
    # The app shell: Electron code, build config, icons and native dependencies.
    paths:
      - apps/desktop/**
      - "!apps/desktop/**/*.test.ts"
      - assets/**
      # The app shell reads and writes client settings with its own copy of this schema, and
      # drops keys it does not know. A new client setting needs a new shell.
      - packages/contracts/src/settings.ts
      - package.json
      - pnpm-lock.yaml
      - scripts/build-desktop-artifact.ts
      - scripts/lib/**
      - .github/workflows/fork-release.yml
  # A daily release keeps new installs and Windows current. It stops early
  # when main has no new commit.
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      notify_agent:
        description: Call the agent webhook if this run fails. The agent sets false on its own retries.
        type: boolean
        default: true

# One run at a time. A newer push replaces a waiting run.
concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      released: ${{ steps.released.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: released
        name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.commit.outputs.sha }}"
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName,name \
            --jq "[.[] | select(.name | contains(\"(${sha:0:12})\"))][0].tagName // empty")"
          if [[ -n "$existing" ]]; then
            echo "Commit ${sha} is already released as ${existing}."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # <base>-nightly.<UTC date>.<run number x 10000>. The date and the run number
      # only grow. The gap of 10000 leaves room for local builds between two CI
      # releases (scripts/fork-desktop-mac.sh). The app needs one integer here.
      - id: version
        name: Resolve release version
        run: |
          vp install --filter=@t3tools/scripts...
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$(( ${{ github.run_number }} * 10000 ))" \
            --sha "${{ steps.commit.outputs.sha }}" \
            --github-output

  build_bundle:
    name: Build JS bundle
    needs: [prepare]
    if: needs.prepare.outputs.released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Optional T3 Connect config. Empty values build the app without T3 Connect.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [prepare, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    # Each platform publishes its own files, so the Mac release does not wait
    # for the slower Windows build, and a Windows failure does not stop it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
          # node-pty compiles from source on Linux, so each arch builds on its own hardware.
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      # Same packages and toolchain as upstream's release-desktop.yml.
      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # The resource monitor build needs the Spectre-mitigated MSVC libraries.
      # The Visual Studio Installer takes minutes, so cache the library folder.
      - id: spectre
        name: Find Spectre-mitigated MSVC lib folder
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $msvc = Get-ChildItem "$installPath\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1
          "path=$($msvc.FullName)\lib\spectre" >> $env:GITHUB_OUTPUT
          "key=msvc-spectre-${env:ImageOS}-${env:ImageVersion}-$($msvc.Name)" >> $env:GITHUB_OUTPUT

      - id: spectre_cache
        if: matrix.platform == 'win'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.spectre.outputs.path }}
          key: ${{ steps.spectre.outputs.key }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win' && steps.spectre_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            Write-Error "Visual Studio Installer failed"
            exit 1
          }

      - if: matrix.platform == 'win' && steps.spectre_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.spectre.outputs.path }}
          key: ${{ steps.spectre.outputs.key }}

      # electron-builder only signs with a trusted identity. The self-made
      # certificate is its own root, so trust it on the runner for code signing.
      - name: Trust fork signing certificate
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "CSC_LINK and CSC_KEY_PASSWORD are required. Squirrel.Mac rejects updates with another signature." >&2
            exit 1
          fi
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/fork.p12"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/fork.p12" -nokeys -clcerts -passin env:CSC_KEY_PASSWORD -out "$RUNNER_TEMP/fork.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fork.pem"
          rm -f "$RUNNER_TEMP/fork.p12"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_MAC_SELF_SIGNED: "true"
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}" --skip-build --verbose)
          # Windows stays unsigned. No Apple API key is set, so macOS is not notarized.
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          # The build script keeps only the dmg and zip, so check the app inside the zip.
          ditto -x -k release/*-arm64.zip "$RUNNER_TEMP/verify"
          app="$(ls -d "$RUNNER_TEMP"/verify/*.app)"
          codesign -dvv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          grep -q "Yarden Zamir T3 Fork" "$RUNNER_TEMP/codesign.txt"

      # The headless server: upstream's self-contained CLI archive with the `t3`
      # single-executable, the web client and the native packages. It needs no
      # Node on the machine. The steps copy upstream's release-desktop.yml.
      - name: Build server single-executable
        if: matrix.platform == 'linux'
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build server archive
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir/${{ matrix.resource_key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" \
            "$monitor_dir/${{ matrix.resource_key }}/"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.prepare.outputs.version }}"
          # The installer checks the download against this file.
          (cd release-cli && for archive in t3-*.tar.gz; do sha256sum "$archive" > "$archive.sha256"; done)

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.blockmap release/*.yml release-cli/*; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      # The first platform to finish creates the release, the others add their files.
      # Each platform has its own updater manifest: nightly-mac.yml, nightly.yml
      # (Windows), nightly-linux.yml (x64) and nightly-linux-arm64.yml.
      # The release creates a tag. GITHUB_TOKEN cannot create a tag on a commit
      # whose workflow files differ from main, which happens when main moved
      # during the run. FORK_SYNC_TOKEN has the workflow scope.
      - name: Publish to the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          MANIFEST: ${{ matrix.platform == 'mac' && 'nightly-mac.yml' || matrix.platform == 'win' && 'nightly.yml' || matrix.arch == 'arm64' && 'nightly-linux-arm64.yml' || 'nightly-linux.yml' }}
        run: |
          set -euo pipefail
          test -s "release-publish/$MANIFEST"
          tag="${{ needs.prepare.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&
            gh release create "$tag" release-publish/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ needs.prepare.outputs.sha }}" \
              --title "${{ needs.prepare.outputs.name }}" \
              --notes "Fork build of ${UPSTREAM_REPOSITORY} main plus fork commits, from ${{ needs.prepare.outputs.sha }}." \
              --prerelease; then
            exit 0
          fi
          gh release upload "$tag" release-publish/* --repo "$GITHUB_REPOSITORY" --clobber

      # A manual run from another branch tests the build without a release.
      - name: Upload assets of a branch run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 3

  # Starts a repair agent on a T3 server through a scheduled-task webhook.
  # Off until the T3_AGENT_WEBHOOK_URL secret is set.
  notify_agent:
    name: Notify repair agent
    needs: [prepare, build_bundle, desktop]
    if: failure() && github.event.inputs.notify_agent != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/fork-notify-agent.sh
          sparse-checkout-cone-mode: false
      - name: Call agent webhook
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.T3_AGENT_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/fork-notify-agent.sh
