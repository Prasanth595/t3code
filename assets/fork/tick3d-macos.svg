<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tick3d app icon: neo-brutalist tile on the macOS icon grid (824px body). -->
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="3.2" fill="#000" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <!-- hard offset shadow -->
  <rect x="128" y="128" width="808" height="808" rx="150" fill="#000"/>
  <!-- tile -->
  <rect x="96" y="96" width="808" height="808" rx="150" fill="#E4E7FF" stroke="#000" stroke-width="28"/>
  <rect x="110" y="110" width="780" height="780" rx="138" fill="url(#dots)"/>
  <!-- sticker: yellow card, slightly rotated, with its own shadow -->
  <g transform="rotate(-6 500 500)">
    <rect x="262" y="282" width="500" height="460" rx="56" fill="#000"/>
    <rect x="232" y="252" width="500" height="460" rx="56" fill="#FFE14D" stroke="#000" stroke-width="26"/>
    <!-- tick -->
    <path d="M330 492 L440 600 L640 372" fill="none" stroke="#000" stroke-width="78" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <!-- pink dot accent -->
  <circle cx="742" cy="270" r="62" fill="#FF5277" stroke="#000" stroke-width="24"/>
</svg>
